services:
  db:
    image: mysql:8.0
    container_name: agenda-massagem-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-example_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agenda_massagem}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      start_period: 60s
      retries: 10
    networks:
      - app_net

  backend:
    build:
      context: ../api/backend
      dockerfile: Dockerfile
    container_name: agenda-massagem-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-example_root_password}
      DB_NAME: ${DB_NAME:-agenda_massagem}
      PORT: ${PORT:-3000}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin123}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

  frontend:
    build:
      context: ../web/frontend
      dockerfile: Dockerfile
    container_name: agenda-massagem-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net

volumes:
  mysql_data:

networks:
  app_net:
    driver: bridge
